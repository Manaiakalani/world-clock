services:
  world-clock:
    build:
      context: .
      args:
        # Set NEXT_PUBLIC_SITE_URL in a .env file next to this compose file to
        # advertise your real public origin to crawlers. Defaults to the local
        # port so a bare `docker compose up` still works.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3009}
    container_name: world-clock
    restart: unless-stopped
    ports:
      - "${PORT:-3009}:3009"
    environment:
      - NODE_ENV=production
    networks:
      - default
      - cloudflared
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3009').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  cloudflared:
    external: true
    name: docker_default
