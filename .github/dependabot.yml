version: 2
updates:
  # npm dependencies. Grouped so routine patch churn arrives as one PR instead
  # of a dozen, while majors stay separate for deliberate review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      types:
        patterns:
          - "@types/*"

  # Workflow actions are pinned to SHAs, so this is the mechanism that keeps
  # them current. Without it, pinning would quietly rot into stale versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Dependabot proposes whatever Node tag is newest, which is often a "Current"
  # release rather than an LTS one. This repo runs LTS only, so a major bump is
  # merged only once that line has actually entered LTS -- check
  # https://github.com/nodejs/Release/blob/main/schedule.json before accepting.
  # Keep .github/workflows/ci.yml's node-version in step with the Dockerfile;
  # CI should test the runtime we actually ship.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
